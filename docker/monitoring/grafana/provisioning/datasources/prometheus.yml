# docker/monitoring/grafana/provisioning/datasources/prometheus.yml
#
# Auto-provisioning на Prometheus datasource в Grafana.
# Grafana го зарежда автоматично при стартиране.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    uid: prometheus
    jsonData:
      timeInterval: "10s"
      httpMethod: POST